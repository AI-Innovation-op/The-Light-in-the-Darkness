name: Validate Godot game

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-and-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify architecture and run Godot tests
        run: python3 tools/ci_validate.py
